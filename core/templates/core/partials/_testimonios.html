<section class="seccion seccion-alt" id="testimonios">
    <div class="contenedor">
        <div class="encabezado-seccion aparece">
            <span class="kicker">Testimonios</span>
            <h2>Lo que dicen quienes ya trabajaron con nosotros</h2>
        </div>

        <div class="carrusel carrusel-resenas aparece pausado" data-autoplay="3500" tabindex="0">

            <div class="carrusel-pista">
                {% for testimonio in testimonios %}
                <article class="testimonio{% if forloop.first %} activa{% endif %}">
                    <div class="estrellas">★★★★★</div>
                    <blockquote>“{{ testimonio.texto }}”</blockquote>
                    <div class="autor">
                        <div class="avatar">{{ testimonio.avatar }}</div>
                        <div>
                            <b>{{ testimonio.nombre }}</b>
                            <span>{{ testimonio.cargo }}</span>
                        </div>
                    </div>
                </article>
                {% endfor %}
            </div>

            <div class="carrusel-controles">
                <button class="carrusel-flecha" type="button" data-dir="-1" aria-label="Reseña anterior" disabled>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M19 12H5M11 18l-6-6 6-6"></path>
                    </svg>
                </button>

                <div class="carrusel-puntos" role="tablist" aria-label="Reseñas de clientes"></div>

                <button class="carrusel-flecha" type="button" data-dir="1" aria-label="Reseña siguiente">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M5 12h14M13 6l6 6-6 6"></path>
                    </svg>
                </button>
            </div>
        </div>

        <div class="clientes aparece">
            {% for cliente in clientes %}
            <div class="cliente-chip">
                <span>
                    <span>{{ cliente.nombre }}</span>
                    <small>{{ cliente.sector }}</small>
                </span>
            </div>
            {% endfor %}
        </div>
    </div>
</section>
