<section class="seccion seccion-alt" id="faq">
    <div class="contenedor">
        <div class="encabezado-seccion aparece">
            <span class="kicker">Preguntas frecuentes</span>
            <h2>Antes de escribirme, esto puede resolver tu duda</h2>
        </div>

        <div class="faq aparece">
            {% for item in faq %}
            <details class="faq-item">
                <summary>{{ item.pregunta }}</summary>
                <p>{{ item.respuesta }}</p>
            </details>
            {% endfor %}
        </div>
    </div>
</section>
