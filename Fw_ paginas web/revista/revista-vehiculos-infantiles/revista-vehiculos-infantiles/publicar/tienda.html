<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tienda · Vehículos infantiles</title>
  <meta name="description" content="Tienda de carros eléctricos, cuatrimotos y motos cross a gasolina para niños. Arma tu carrito y recibe la cotización por WhatsApp.">
  <meta name="theme-color" content="#22324A">
  <link rel="icon" href="assets/logo/logo-prueba.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="vendor/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="vendor/bootstrap-icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/sitio.css">
  <link rel="stylesheet" href="css/tienda.css">
</head>
<body>
  <a class="saltar" href="#productos">Ir a los productos</a>
  <header id="cabecera"></header>

  <main class="container tienda">
    <section class="banners banners--tienda" id="banners" aria-label="Destacados"></section>

    <div class="tienda__cabeza">
      <div>
        <h1 class="titulo">Tienda</h1>
        <p class="sub" id="resumen" aria-live="polite"></p>
      </div>
      <div class="tienda__orden">
        <button class="btn-secundario d-lg-none" type="button" data-bs-toggle="offcanvas" data-bs-target="#filtros" aria-controls="filtros"><i class="bi bi-sliders"></i> Filtros</button>
        <label class="campo"><span>Ordenar por</span>
          <select id="orden" class="form-select">
            <option value="">Destacados</option>
            <option value="precio-asc">Menor precio</option>
            <option value="precio-desc">Mayor precio</option>
            <option value="nombre">Nombre (A–Z)</option>
          </select>
        </label>
      </div>
    </div>

    <div class="tienda__grid">
      <!-- filtros: columna lateral en computador, panel en celular -->
      <aside class="offcanvas-lg offcanvas-start filtros-lat" tabindex="-1" id="filtros" aria-labelledby="filtros-titulo">
        <div class="offcanvas-header">
          <h2 class="offcanvas-title" id="filtros-titulo">Filtros</h2>
          <button type="button" class="btn-close" data-bs-dismiss="offcanvas" data-bs-target="#filtros" aria-label="Cerrar"></button>
        </div>
        <div class="offcanvas-body">
          <form id="form-filtros">
            <fieldset>
              <legend>Tipo de propulsión</legend>
              <div id="f-prop"></div>
            </fieldset>
            <fieldset>
              <legend>Categoría</legend>
              <div id="f-cat"></div>
            </fieldset>
            <fieldset>
              <legend><label for="f-edad">Edad del niño</label></legend>
              <select id="f-edad" class="form-select"><option value="">Todas las edades</option></select>
            </fieldset>
            <fieldset>
              <legend><label for="f-precio">Precio máximo</label></legend>
              <input type="range" class="form-range" id="f-precio" step="10000">
              <output id="f-precio-txt" for="f-precio"></output>
            </fieldset>
            <label class="form-check f-disp"><input class="form-check-input" type="checkbox" id="f-disponibles"> <span class="form-check-label">Solo disponibles</span></label>
            <button type="button" class="btn-secundario w-100 mt-3" id="limpiar">Quitar filtros</button>
          </form>
        </div>
      </aside>

      <section id="productos" aria-label="Productos">
        <div class="filtros-activos" id="activos"></div>
        <div class="grilla grilla--tienda" id="grilla"></div>
        <div class="vacio d-none" id="sin-resultados">
          <p><b>No hay vehículos con esos filtros.</b> Prueba con otra edad o con otro tipo de propulsión, o escríbenos y te ayudamos a encontrarlo.</p>
          <button type="button" class="btn-secundario" id="limpiar-2">Quitar filtros</button>
        </div>
        <p class="nota-precios" id="nota-precios"></p>
      </section>
    </div>
  </main>

  <footer id="pie" class="pie"></footer>

  <script src="vendor/bootstrap/bootstrap.bundle.min.js"></script>
  <script src="js/creditos.js"></script>
  <script src="js/datos.js"></script>
  <script src="js/fichas.js"></script>
  <script src="js/carrito.js"></script>
  <script src="js/tienda.js"></script>
</body>
</html>
